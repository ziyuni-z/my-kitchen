<!doctype html>
<html lang="zh-CN"><head>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/my-kitchen/sw.js')
        .then(() => console.log('My Kitchen PWA ready'))
        .catch(error => console.error('SW error:', error));
    });
  }
</script>
<link rel="manifest" href="/my-kitchen/manifest.json">
<meta name="theme-color" content="#41664E">
<link rel="icon" type="image/png" href="/my-kitchen/icons/icon-192.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Kitchen · 私人菜谱</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#332d28;background:#faf7f1}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #eee5da;padding:20px max(20px,calc((100vw - 1040px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-family:Georgia,serif;margin:0;font-size:30px;color:#47634e}small{color:#897f72}.wrap{max-width:1040px;margin:auto;padding:28px 20px}.hero{background:#e9eee4;border-radius:22px;padding:32px;margin-bottom:24px}.hero h2{font-family:Georgia,serif;font-size:32px;margin:0 0 8px}.hero p{margin:0;color:#62705f}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}input,select,textarea{font:inherit;border:1px solid #d8d4cc;border-radius:10px;padding:12px;background:#fff;max-width:100%}input[type=search]{flex:1;min-width:190px}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 17px;background:#47634e;color:white}button.secondary{background:#f0eee8;color:#3d463b}button.danger{background:#9b4d45}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.recipe{background:white;border:1px solid #eee8df;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 16px #3028180a}.thumb{height:140px;background:linear-gradient(135deg,#e4ebd9,#f5e5d6);display:flex;align-items:center;justify-content:center;font-size:52px}.thumb img{width:100%;height:100%;object-fit:cover}.content{padding:18px}.content h3{margin:8px 0 6px;font-size:19px}.pill{display:inline-block;background:#eef1e9;color:#526a55;border-radius:30px;padding:4px 10px;font-size:12px}.muted{color:#8c857b}.panel{max-width:520px;background:white;border-radius:18px;padding:26px;margin:35px auto;box-shadow:0 10px 35px #0000000c}.panel input,.panel textarea,.panel select{width:100%;margin:6px 0 15px}.panel textarea{min-height:105px}label{font-weight:600;font-size:14px}dialog{border:0;border-radius:20px;padding:0;max-width:min(650px,94vw);width:100%;max-height:90vh;overflow:auto}dialog::backdrop{background:#201c18a8}.dialog-inner{padding:26px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.hidden{display:none!important}#status{padding:12px 0;color:#775f3d;white-space:pre-wrap}.details{white-space:pre-wrap;line-height:1.75}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}a{color:#47634e}@media(max-width:600px){header{padding:15px 20px}.hero{padding:24px}.hero h2{font-size:26px}}
</style></head><body>
<header><div><h1>My Kitchen</h1><small>我的私人菜谱 · Made with love</small></div><button id="logout" class="secondary hidden">退出登录</button></header>
<main class="wrap"><section class="hero"><h2>今天想做什么好吃的？</h2><p>收藏喜欢的味道，让每一道家常菜都有自己的故事。</p></section>
<div id="setup" class="panel hidden"><h2>连接数据库</h2><p>请先在文件顶部填入 Supabase Project URL 和 publishable/anon key。不要填 service_role 或 secret key。</p></div>
<section id="auth" class="panel hidden"><h2>登录私人菜谱</h2><p class="muted">使用在 Supabase Authentication 创建的邮箱和密码。</p><form id="loginForm"><label>邮箱</label><input id="email" type="email" autocomplete="email" required><label>密码</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">登录</button></form></section>
<section id="app" class="hidden"><div class="topline"><h2>我的菜谱 <span id="count" class="muted"></span></h2><button id="add">＋ 添加菜谱</button></div><div class="controls"><input id="search" type="search" placeholder="搜索菜名、食材或分类…"><select id="category"><option value="">全部分类</option></select></div><div id="grid" class="grid"></div><p id="empty" class="muted hidden">这里还没有菜谱，点击“添加菜谱”开始吧。</p></section><div id="status" role="status"></div></main>
<dialog id="detail"><div class="dialog-inner"><div class="topline"><span id="detailCategory" class="pill"></span><button class="secondary" onclick="document.getElementById('detail').close()">关闭</button></div><h2 id="detailTitle"></h2><h3>食材</h3><div id="detailIngredients" class="details"></div><h3>做法</h3><div id="detailInstructions" class="details"></div><h3>备注</h3><div id="detailNotes" class="details"></div><div class="actions"><button id="edit">编辑</button><button id="delete" class="danger">删除</button></div></div></dialog>
<dialog id="editor"><div class="dialog-inner"><div class="topline"><h2 id="editorTitle">添加菜谱</h2><button class="secondary" onclick="document.getElementById('editor').close()">关闭</button></div><form id="recipeForm"><label>菜名</label><input id="fTitle" required><label>分类</label><input id="fCategory" placeholder="例如：家常菜"><label>食材</label><textarea id="fIngredients"></textarea><label>步骤</label><textarea id="fInstructions"></textarea><label>备注</label><textarea id="fNotes"></textarea><label>图片网址（可选）</label><input id="fImage" type="url"><button type="submit">保存菜谱</button></form></div></dialog>
<script type="module">
// 请只替换以下两项。Project URL 和 publishable/anon key 可以用于浏览器；绝不能填 secret/service_role key。
const SUPABASE_URL = 'https://uqmxkrscmjwyjcxoobfp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OX_X89pqkprWJYmO-BtpPA_FVruez_9';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const $=id=>document.getElementById(id), show=(id,yes)=>$(id).classList.toggle('hidden',!yes);
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_KEY.startsWith('PASTE_');
let db,user,recipes=[],active=null,editing=null;
const message=(s='')=>$('status').textContent=s;
if(!configured){show('setup',true)}else{db=createClient(SUPABASE_URL,SUPABASE_KEY);init()}
async function init(){const {data:{session},error}=await db.auth.getSession();if(error)message(error.message);await setSession(session);db.auth.onAuthStateChange((_event,s)=>{setSession(s)})}
async function setSession(session){user=session?.user||null;show('auth',!user);show('app',!!user);show('logout',!!user);if(user)await load();else{recipes=[];render()}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();message('正在登录…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});message(error?`登录失败：${error.message}`:'')});
$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)message(error.message)};
async function load(){message('正在加载菜谱…');const {data,error}=await db.from('recipes').select('*').order('created_at',{ascending:false});if(error){message('加载失败：'+error.message);return}recipes=data||[];message('');render()}
function render(){const q=$('search').value.trim().toLowerCase(),c=$('category').value;const categories=[...new Set(recipes.map(r=>r.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">全部分类</option>';for(const x of categories){const o=document.createElement('option');o.value=x;o.textContent=x;$('category').append(o)}$('category').value=categories.includes(c)?c:'';const filtered=recipes.filter(r=>(!$('category').value||r.category===$('category').value)&&[r.title,r.category,r.ingredients].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=`(${filtered.length})`;$('grid').replaceChildren();show('empty',!filtered.length);for(const r of filtered){const card=document.createElement('article');card.className='recipe';const thumb=document.createElement('div');thumb.className='thumb';if(r.image_url&&/^https:\/\//.test(r.image_url)){const img=document.createElement('img');img.src=r.image_url;img.alt=r.title||'菜谱';img.onerror=()=>{thumb.textContent='🍲'};thumb.append(img)}else thumb.textContent='🍲';const body=document.createElement('div');body.className='content';const pill=document.createElement('span');pill.className='pill';pill.textContent=r.category||'未分类';const title=document.createElement('h3');title.textContent=r.title||'未命名菜谱';body.append(pill,title);card.append(thumb,body);card.onclick=()=>openDetail(r);$('grid').append(card)}}
$('search').oninput=render;$('category').onchange=render;
function fill(id,value){$(id).textContent=value||'暂无'}
function openDetail(r){active=r;fill('detailTitle',r.title);fill('detailCategory',r.category||'未分类');fill('detailIngredients',r.ingredients);fill('detailInstructions',r.instructions);fill('detailNotes',r.notes);$('detail').showModal()}
function openEditor(r=null){editing=r;$('editorTitle').textContent=r?'编辑菜谱':'添加菜谱';for(const [id,key] of [['fTitle','title'],['fCategory','category'],['fIngredients','ingredients'],['fInstructions','instructions'],['fNotes','notes'],['fImage','image_url']])$(id).value=r?.[key]||'';$('editor').showModal()}
$('add').onclick=()=>openEditor();$('edit').onclick=()=>{$('detail').close();openEditor(active)};
$('recipeForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const row={title:$('fTitle').value.trim(),category:$('fCategory').value.trim(),ingredients:$('fIngredients').value,instructions:$('fInstructions').value,notes:$('fNotes').value,image_url:$('fImage').value.trim()||null};message('正在保存…');let result;if(editing)result=await db.from('recipes').update(row).eq('id',editing.id).eq('user_id',user.id);else result=await db.from('recipes').insert({...row,user_id:user.id});if(result.error){message('保存失败：'+result.error.message);return}$('editor').close();await load()};
$('delete').onclick=async()=>{if(!active||!confirm(`确定删除「${active.title}」吗？`))return;const {error}=await db.from('recipes').delete().eq('id',active.id).eq('user_id',user.id);if(error){message('删除失败：'+error.message);return}$('detail').close();await load()};
</script></body></html>
